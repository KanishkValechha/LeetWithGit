name: Package extension release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-extension.yml

  attach-package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download validated package artifact
        uses: actions/download-artifact@v4
        with:
          name: leet-with-git-extension
          path: dist

      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/LeetWithGit-v*.zip --clobber --repo "$GITHUB_REPOSITORY"
