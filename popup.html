<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BetterLeetWithGit settings</title>
    <style>
      :root { color-scheme: light dark; font: 14px/1.45 system-ui, sans-serif; }
      body { width: 330px; margin: 0; padding: 18px; }
      h1 { margin: 0 0 6px; font-size: 19px; }
      p { margin: 0 0 14px; color: #667085; }
      label { display: block; margin: 12px 0 5px; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; padding: 9px; border: 1px solid #98a2b3; border-radius: 6px; }
      input:focus { outline: 2px solid #2cbb5d; outline-offset: 1px; }
      .hint { margin-top: 5px; color: #667085; font-size: 12px; }
      .buttons { display: flex; gap: 8px; margin-top: 15px; }
      button { flex: 1; padding: 9px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 650; }
      #save { background: #2cbb5d; color: #fff; }
      #test-connection { background: #e7f7ed; color: #176b36; }
      button:disabled { cursor: wait; opacity: .65; }
      .status { margin-top: 12px; padding: 9px; border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .status:empty { display: none; }
      .success { background: #e7f7ed; color: #176b36; }
      .error { background: #ffeaea; color: #a11919; }
      .neutral { background: #f2f4f7; color: #344054; }
      .note { margin-top: 14px; font-size: 12px; }
      @media (prefers-color-scheme: dark) {
        p, .hint { color: #b7c0ce; }
        #test-connection { background: #173b26; color: #b5f2c9; }
        .neutral { background: #28313e; color: #e5eaf0; }
        .success { background: #173b26; color: #b5f2c9; }
        .error { background: #4b2020; color: #ffd4d4; }
      }
    </style>
  </head>
  <body>
    <h1>BetterLeetWithGit</h1>
    <p>Save accepted LeetCode solutions to your repository.</p>

    <label for="github-token">Fine-grained GitHub token</label>
    <input id="github-token" type="password" placeholder="Paste token to add or replace it" autocomplete="off" spellcheck="false">
    <div id="token-state" class="hint">Token is kept on this browser and is not synced.</div>

    <label for="repo-name">Repository</label>
    <input id="repo-name" type="text" placeholder="username/repository" autocomplete="off" spellcheck="false">

    <label for="branch-name">Branch</label>
    <input id="branch-name" type="text" placeholder="main" autocomplete="off" spellcheck="false">

    <div class="buttons">
      <button id="save" type="button">Save settings</button>
      <button id="test-connection" type="button">Test connection</button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="sync-status" class="status" role="status" aria-live="polite"></div>

    <p class="note">For a fine-grained token, select this repository and grant <strong>Contents: Read and write</strong>. The extension stores the token locally and retries temporary upload failures automatically.</p>
    <script src="popup.js"></script>
  </body>
</html>
